# GitHub Pages — the public demo (docs/deploy-demo.md).
#
# Gating: the site only publishes when ALL THREE pass —
#   1. the backend suite (app/, the fake-driven oracle),
#   2. the designer unit tests + the PAGES_EXPORT static build,
#   3. the landing + player smoke (deploy/tools/pages_smoke.mjs, real fixture).
#
# Shape: the modern `actions/upload-pages-artifact` → `actions/deploy-pages`
# pair; only the final deploy job carries `pages:write` / `id-token:write`.
#
# Hosting: the repo's *project page* — this repo serves at /GUTS/
# (e.g. alexscotland.github.io/GUTS/) with the landing at the site root and
# the designer right underneath it. The landing's links are relative
# (`designer/`) so they hold at any subpath, and the designer's basePath is
# baked at build time from PAGES_BASE_PATH below (next.config.js; its default
# of /designer only fits an apex host such as a custom domain).
#
# Optional live API: set the repo variable `LIVE_API_URL` to the HTTPS origin
# of the `GUTS_DEMO=1` backend. The build bakes it into the static designer
# (NEXT_PUBLIC_API_URL) and into the landing's config.json (`live_api`).
# Blank/unset → a backend-free static site (the replay needs no backend).

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      LIVE_API_URL: ${{ vars.LIVE_API_URL }}
    steps:
      - uses: actions/checkout@v4

      # ── gate 1: the backend is the oracle ────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Backend test suite (README "Run the tests")
        working-directory: app
        run: |
          python -m pip install --quiet --target .pydeps -r requirements.txt pytest
          PYTHONPATH=.pydeps python -m pytest tests/ -q

      # ── gate 2: designer unit tests + the PAGES_EXPORT build ─────────
      # Node 22.6+ is required: the designer's `npm test` runs
      # `node --experimental-strip-types`, which Node 20 does not have
      # (unknown option → exit 9). Pinned to 24 to match the dev toolchain.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: designer/package-lock.json
      - name: Designer unit tests
        working-directory: designer
        run: npm ci && npm test
      - name: Build the static designer export (PAGES_EXPORT=1)
        working-directory: designer
        # NEXT_PUBLIC_API_URL is baked at build time (designer/app/lib/api.ts);
        # blank keeps the client same-origin, which is the honest state without
        # a live backend. Use `npm run` so `next` resolves via node_modules/.bin
        # (a bare `next` isn't on the runner's PATH → command not found).
        # PAGES_BASE_PATH must match where this repo's site is served: the
        # project page under /GUTS/, so the designer lives at /GUTS/designer/.
        run: NEXT_PUBLIC_API_URL="$LIVE_API_URL" PAGES_BASE_PATH="/GUTS/designer" npm run build:pages
      - name: Land the export where the Pages artifact expects it
        run: |
          mkdir -p deploy/pages/designer
          cp -R designer/out/. deploy/pages/designer/

      # ── landing config + gate 3: the smoke against the real fixture ─
      - name: Bake the live API into the landing config (optional)
        run: |
          python3 - <<'EOF'
          import json, os
          path = "deploy/pages/config.json"
          cfg = json.load(open(path))
          cfg["live_api"] = os.environ.get("LIVE_API_URL", "").rstrip("/")
          with open(path, "w") as fh:
              json.dump(cfg, fh, indent=2)
              fh.write("\n")
          EOF
      - name: Landing + player smoke (product assertions, real fixture)
        run: node deploy/tools/pages_smoke.mjs

      - name: Validate the artifact shape
        run: |
          test -f deploy/pages/index.html
          test -f deploy/pages/assets/js/player.js
          test -f deploy/pages/assets/replay/run.json
          test -f deploy/pages/designer/index.html
          test -f deploy/pages/designer/index.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/pages

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
