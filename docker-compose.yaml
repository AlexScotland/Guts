  services:
    app:
      build:
        context: ./app/
        dockerfile: Dockerfile
      command: python server.py
      environment:
        - SEARXNG_HOST=http://core:8080
      volumes:
        - "./app/:/app/"
      ports:
        - "8000:8000"
      container_name: agent-app
      depends_on:
        - core
      extra_hosts:
      - "host.docker.internal:host-gateway"

    design-mcp:
      # Face 1: the GUTS design face (design/draft + catalog) as an MCP
      # server — hand-rolled JSON-RPC 2.0, no SDK (app/mcp is this repo's
      # own client package with that name; the official SDK would shadow
      # it). Reuses the app image; serves the http transport on 8090 so
      # remote clients reach it. draft() reaches the host's Ollama via
      # host-gateway, same as `app`.
      # Tailscale mapping (from Alex's notes):
      #   ts map add --https aifactory.tailnet.ca:8090 design-mcp:8090
      build:
        context: ./app/
        dockerfile: Dockerfile
      command: python -m design.mcp_server --http 8090
      volumes:
        - "./app/:/app/"
      ports:
        - "8090:8090"
      container_name: design-mcp
      extra_hosts:
      - "host.docker.internal:host-gateway"

    frontend:
      build:
        context: ./chat-ui/
        dockerfile: Dockerfile
      ports:
        - "3010:3000"
      environment:
        # The client uses relative URLs (no NEXT_PUBLIC_API_URL); the
        # running Next server proxies /api/* and /health to the backend
        # container. Must resolve FROM THIS container: compose service
        # name `app`, not localhost.
        - BACKEND_PROXY_TARGET=http://app:8000

    designer:
      # ── Dev-server mode ────────────────────────────────────────────────────
      # Targets the `build` stage: it keeps the full node_modules + Next CLI.
      # (The `runner` stage that the production image uses ships a pruned
      # standalone node_modules without the CLI, so `next dev` cannot run
      # there.)  The app source is volume-mounted for hot reload, and the
      # command below overrides the image's production CMD.
      #
      # To go back to the production image: delete `target`, `environment`,
      # `volumes` and `command` from this service, then
      #   docker compose build designer && docker compose up -d designer
      build:
        context: ./designer/
        dockerfile: Dockerfile
        target: build
      ports:
        - "3020:3000"
      environment:
        # The client uses relative URLs (no NEXT_PUBLIC_API_URL): the
        # `next dev` server proxies /api/* and /health to the backend
        # container. BACKEND_PROXY_TARGET is read by the Next server, so
        # it must resolve FROM THIS container: compose service name `app`,
        # not localhost.
        - BACKEND_PROXY_TARGET=http://app:8000
        # The design face (face 1, `design-mcp` service): the DESIGN panel
        # proxies its MCP endpoint the same way (see next.config.js).
        - DESIGN_MCP_PROXY_TARGET=http://design-mcp:8090
        # Bind all interfaces so the dev server is reachable through the
        # host port mapping.
        - HOSTNAME=0.0.0.0
        # Served under the /designer subpath (aifactory's `tailscale serve`
        # maps /designer → :3020, other prefixes to other services). Bake
        # that prefix in so page, static assets and API calls all stay
        # inside it — otherwise assets escape to /_next/ and the proxy
        # hands them to the catch-all service (404, unstyled page).
        - NEXT_PUBLIC_BASE_PATH=/designer
        # Allow the dev server's HMR websocket from the serve hostname.
        - NEXT_PUBLIC_DEV_ORIGIN=aifactory.tail26bcb1.ts.net
      volumes:
        # Live source tree — HMR picks up edits without a rebuild.
        - ./designer/app:/app/app
        # Live config too: the image bakes its own copy at build time, and
        # without this mount config changes would need an image rebuild.
        - ./designer/next.config.js:/app/next.config.js:ro
        # Fresh in-memory .next for the dev server.  Without this it would
        # inherit the production build output baked into the `build` stage
        # image, and the dev server does not clear that on its own.
        - type: tmpfs
          target: /app/.next
      command: npm run dev

    core:
      container_name: searxng-core
      image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
      restart: always
      ports:
        - ${SEARXNG_HOST:+${SEARXNG_HOST}:}${SEARXNG_PORT:-8080}:${SEARXNG_PORT:-8080}
      env_file: ./searxng/.env
      volumes:
        - ./searxng/core-config/:/etc/searxng/:Z
        - ./searxng/core-data:/var/cache/searxng/

    valkey:
      container_name: searxng-valkey
      image: docker.io/valkey/valkey:9-alpine
      command: valkey-server --save 30 1 --loglevel warning
      restart: always
      volumes:
        - ./searxng/valkey-data:/data/

  volumes:
    core-data:
    valkey-data:
